{% load static %}<article class="dish-card"><a href="{% url 'product_detail' product.slug %}" class="dish-image"><div class="food-photo tile-{{ product.photo_tile }}" role="img" aria-label="{{ product.name }}"></div><span class="diet-tag">{{ product.get_dietary_display }}</span></a><div class="dish-info"><div class="dish-meta">{{ product.category }} · {{ product.prep_minutes }} min</div><a href="{% url 'product_detail' product.slug %}"><h3>{{ product.name }}</h3></a><p>{{ product.description|truncatechars:80 }}</p><div class="dish-bottom"><strong>₹{{ product.price|floatformat:0 }}</strong><form method="post" action="{% url 'cart_add' product.id %}">{% csrf_token %}<input type="hidden" name="quantity" value="1"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" aria-label="Add {{ product.name }}" {% if not product.stock %}disabled{% endif %}>+</button></form></div></div></article>
